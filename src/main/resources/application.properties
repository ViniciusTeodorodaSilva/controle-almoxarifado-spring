spring.application.name=controle-almoxarifado

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
debug=false
trace=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
spring.mvc.log-request-details=false
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

server.servlet.session.cookie.name=BESSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/
server.servlet.session.tracking-modes=cookie
server.servlet.session.timeout=${BES_AUTH_SESSION_TIMEOUT:30m}
bes.cors.origins=${BES_CORS_ORIGINS:}
bes.bootstrap.enabled=${BES_BOOTSTRAP_ADMIN_ENABLED:false}
bes.bootstrap.username=${BES_BOOTSTRAP_ADMIN_USERNAME:}
bes.bootstrap.password=${BES_BOOTSTRAP_ADMIN_PASSWORD:}
logging.pattern.level=%5p [requestId=%X{requestId:-}]
